name: A3 model tests and deployment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: course-vm
    env:
      A3_IMAGE: lha007/car-price-a3:${{ github.sha }}
      SSH_HOST: ml.brain.cs.ait.ac.th
      SSH_USER: st127132
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.A3_IMAGE }}
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.A3_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.A3_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy tested image and check health
        run: |
          ssh "$SSH_USER@$SSH_HOST" 'mkdir -p ~/car-price-a3'
          scp app/docker-compose.yaml "$SSH_USER@$SSH_HOST:~/car-price-a3/docker-compose.yaml"
          ssh "$SSH_USER@$SSH_HOST" "cd ~/car-price-a3 && A3_IMAGE='$A3_IMAGE' docker compose pull && A3_IMAGE='$A3_IMAGE' docker compose up -d --wait --wait-timeout 120"
          curl --fail --retry 6 --retry-all-errors --retry-delay 5 https://st127132.ml.brain.cs.ait.ac.th/a3/_stcore/health
