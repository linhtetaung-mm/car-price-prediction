name: st127132-car-price-a3
services:
  car-price-a3:
    image: ${A3_IMAGE:-lha007/car-price-a3:latest}
    platform: linux/amd64
    environment:
      PORT: "8501"
      STREAMLIT_SERVER_BASE_URL_PATH: a3
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.services.car-price-a3-st127132.loadbalancer.server.port=8501
      - traefik.http.routers.car-price-a3-st127132.rule=Host(`st127132.ml.brain.cs.ait.ac.th`) && PathPrefix(`/a3`)
      - traefik.http.routers.car-price-a3-st127132.priority=100
      - traefik.http.routers.car-price-a3-st127132.tls=true
      - traefik.http.routers.car-price-a3-st127132.tls.certresolver=letsencrypt
      - traefik.http.routers.car-price-a3-st127132.entrypoints=websecure
    networks: [web]
networks:
  web:
    external: true
